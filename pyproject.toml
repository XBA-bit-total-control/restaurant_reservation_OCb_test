[project]
name = "restaurant-reservation"
version = "0.1.0"
description = "Performing a test task for the company ОСЬ"
readme = "README.md"
authors = [
    { name = "Vladislav Huc", email = "vladislavhucisvili@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "pytest>=9.2.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standart]>=0.54.0",
]

[project.scripts]
restaurant-reservation = "restaurant_reservation:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
